<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealSpan · Add-on deal diligence</title>
<meta name="description" content="Deterministic, auditable diligence for independent sponsors and small PE platforms evaluating add-on acquisitions.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="top">
  <div class="top-inner">
    <div class="brand"><b>DealSpan</b><span>by RedHaek</span></div>
    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <div class="top-actions">
      <button class="btn quiet" data-act="assumptions">Assumptions</button>
      <button class="btn quiet" data-act="precedents">Precedents</button>
    </div>
  </div>
</div>
<div class="span-wrap" id="span"></div>
<main id="main"></main>
<footer class="foot">
  DealSpan is a pre-LOI screen, not a quality-of-earnings report or a valuation opinion. No AI runs in this product: every number comes from your inputs, a labeled rule, or a cited source.
  <a href="#" data-act="sources">Sources</a> · <a href="https://github.com/cleatis-lo/deal-span">Code and tests</a>
</footer>
<div id="drawer"></div>
<script src="vendor/xlsx.full.min.js"></script>
<script type="module" src="js/app.js"></script>

</html>
